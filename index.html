<style>
  :root{
    --panel:#fbeaff; --card-b:#ecdcff; --sel:#c65be8;
    --bs:68px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:#fff6d6}
  #app{display:flex;height:100vh;height:100dvh}

  /* ---------- 左側舞台 ---------- */
  #stageWrap{position:relative;flex:1;min-width:0;background:#fff0a8;transition:background .4s;overflow:hidden}
  #stage{width:100%;height:100%;display:block;overflow:visible}

  .rbtn{position:absolute;width:var(--bs);height:var(--bs);border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 35% 28%,#b3bfff,#7d8ef0 70%);
    box-shadow:0 0 0 5px #fff,0 9px 16px rgba(90,100,180,.28);display:grid;place-items:center;
    transition:transform .15s;z-index:3;padding:0}
  .rbtn:active{transform:scale(.9)}
  .rbtn svg{width:56%;height:56%}
  #bHome{top:22px;left:22px}
  #bUndo{top:22px;left:calc(22px + var(--bs)*1.3)}
  #bDice{top:22px;left:calc(22px + var(--bs)*2.6)}
  #bSound{top:22px;left:calc(22px + var(--bs)*3.9)}
  #nextWrap{position:absolute;top:8px;right:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
  #dots{display:flex;gap:5px}
  #dots i{width:10px;height:10px;border-radius:50%;background:#e9dc9b;transition:background .3s}
  #dots i.on{background:#3cbf6a}
  #bNext{position:relative;width:calc(var(--bs)*1.2);height:calc(var(--bs)*1.2);
    background:radial-gradient(circle at 35% 28%,#5fdc8b,#1f9b4e 72%);box-shadow:0 0 0 6px #fff,0 9px 16px rgba(30,120,60,.3)}
  #bCam{bottom:24px;right:24px;width:calc(var(--bs)*1.4);height:calc(var(--bs)*1.4);border-radius:28px;
    background:#fff;box-shadow:0 0 0 5px #8ea2ff,0 10px 18px rgba(90,100,180,.3)}
  #bCam svg{width:74%;height:74%}
  #bCam.hint{animation:wiggle .6s ease 3}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}

  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
  #flash.go{animation:flash .5s ease}
  @keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}

  /* 舞台動畫 */
  #bob{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  #boing{transform-box:fill-box;transform-origin:50% 100%}
  #boing.go{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes boing{0%{transform:scale(1.05,.93)}100%{transform:scale(1,1)}}
  #stage .blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  #stage .glit{animation:shimmer 1.6s ease-in-out infinite alternate}
  @keyframes shimmer{from{opacity:.55}to{opacity:1}}
  .spk{transform-box:fill-box;transform-origin:center;animation:spk .8s ease-out forwards}
  @keyframes spk{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(120deg);opacity:0}}

  /* ---------- 右側選單 ---------- */
  #panel{width:400px;flex:none;background:var(--panel);display:flex;flex-direction:column;
    border-left:4px solid #f3dcff;box-shadow:-6px 0 22px rgba(180,120,200,.15)}
  #tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 14px 14px;border-bottom:4px solid #f0d8fb}
  .tab{border-radius:20px;border:3px solid #eedcff;background:#fff;cursor:pointer;padding:6px 0 4px;
    display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #ecd6f7;transition:transform .15s}
  .tab svg{width:38px;height:38px}
  .tab small{font-size:12px;color:#a67cbd;font-weight:700;letter-spacing:1px}
  .tab.on{background:linear-gradient(160deg,#f090f6,#c35be6);border-color:#fff;box-shadow:0 4px 0 #a146c4,0 0 0 3px #e9b0f7}
  .tab.on small{color:#fff}
  .tab:active,.card:active,.sw:active{transform:scale(.92)}
  #body{flex:1;display:flex;min-height:0;gap:10px;padding:12px}
  #palette{width:66px;flex:none;background:#c4f0ff;border-radius:24px;padding:12px 0;display:flex;flex-direction:column;
    align-items:center;gap:12px;overflow-y:auto;box-shadow:inset 0 0 0 3px #a8e4fa}
  #palette.hide{display:none}
  .sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;cursor:pointer;flex:none;padding:0;
    box-shadow:inset -4px -5px 0 rgba(0,0,0,.14),inset 4px 4px 0 rgba(255,255,255,.45),0 3px 0 rgba(0,0,0,.08);transition:transform .15s}
  .sw.on{transform:scale(1.15);box-shadow:0 0 0 4px #4fb2ff,inset -4px -5px 0 rgba(0,0,0,.14),inset 4px 4px 0 rgba(255,255,255,.45)}
  .sw.spark{background:conic-gradient(#ff9ad5,#ffe27a,#9ee8ff,#c79bff,#ff9ad5);display:grid;place-items:center}
  .sw.spark svg{width:24px;height:24px}
  .sw.spark:not(.on){filter:grayscale(.7) opacity(.7)}
  .divider{width:34px;height:3px;border-radius:3px;background:#9fdcf3;flex:none}
  #grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;padding:4px 6px 24px 4px}
  .card{aspect-ratio:1;background:#fff;border:3px solid var(--card-b);border-radius:24px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;padding:6px 6px 4px;box-shadow:0 4px 0 #efe0fa;transition:transform .15s}
  .card svg{width:100%;flex:1;min-height:0}
  .card span{font-size:12px;color:#a57bbd;font-weight:700;line-height:1.3}
  .card.on{border:4px solid var(--sel);box-shadow:0 0 0 4px #f5d6ff,0 4px 0 #d8a8ee}
  #grid::-webkit-scrollbar,#palette::-webkit-scrollbar{width:0}

  /* ---------- 拍照預覽 ---------- */
  #photo{position:fixed;inset:0;background:rgba(90,60,110,.45);display:none;place-items:center;z-index:10;padding:20px}
  #photo.show{display:grid;animation:fadein .3s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .polaroid{background:#fff;border-radius:18px;padding:16px 16px 18px;box-shadow:0 20px 40px rgba(60,30,80,.35);
    transform:rotate(-2deg);max-width:min(440px,92vw);text-align:center;animation:dropin .5s cubic-bezier(.3,1.5,.5,1)}
  @keyframes dropin{from{transform:translateY(-40px) rotate(-8deg) scale(.8)}to{transform:rotate(-2deg)}}
  .polaroid img{width:100%;border-radius:10px;display:block;max-height:62vh;object-fit:contain;background:#fff6d6}
  .polaroid p{margin:12px 0 12px;color:#b169c9;font-weight:800;font-size:18px;letter-spacing:2px}
  .pbtns{display:flex;gap:12px;justify-content:center}
  .pbtns button,.pbtns a{border:none;border-radius:999px;padding:10px 22px;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;font-family:inherit}
  #dl{background:linear-gradient(160deg,#8ea2ff,#6f80ec);color:#fff;box-shadow:0 4px 0 #5566c9}
  #closeP{background:#f5e6fb;color:#a067b8;box-shadow:0 4px 0 #e2c8ee}

  #toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:#fff;color:#b169c9;font-weight:800;font-size:18px;
    padding:12px 26px;border-radius:999px;box-shadow:0 8px 20px rgba(120,60,140,.25);opacity:0;pointer-events:none;z-index:20}
  #toast.show{animation:toast 2.2s ease}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
  /* ---------- 直式 / 手機 ---------- */
  @media (max-aspect-ratio: 1/1){
    :root{--bs:50px}
    #app{flex-direction:column}
    #stageWrap{flex:0 0 54%}
    #panel{width:100%;flex:1;min-height:0;border-left:none;border-top:4px solid #f3dcff}
    #tabs{grid-template-columns:repeat(8,1fr);gap:6px;padding:10px}
    .tab{border-radius:14px;padding:4px 0 2px}
    .tab svg{width:28px;height:28px}
    .tab small{font-size:10px;letter-spacing:0}
    #body{padding:10px}
    #palette{width:56px;gap:10px}
    .sw{width:36px;height:36px}
    #grid{grid-template-columns:repeat(3,1fr);gap:10px}
    #bHome,#bUndo,#bDice,#bSound{top:14px}
    #bHome{left:14px}
  }
  @media (max-width:420px){ #grid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <svg id="stage" viewBox="0 0 700 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs id="staticDefs"></defs>
      <defs id="dynDefs"></defs>
      <g id="scene"></g>
      <ellipse cx="350" cy="655" rx="100" ry="15" fill="#000" opacity=".1"/>
      <g transform="translate(150,122)">
        <g id="bob"><g id="boing"><g id="charLayers"></g></g></g>
        <g id="fx"></g>
      </g>
    </svg>

    <button class="rbtn" id="bHome" aria-label="重新開始"><svg viewBox="0 0 48 48"><path d="M8 24 L24 9 L40 24 L35 24 L35 39 L28 39 L28 29 L20 29 L20 39 L13 39 L13 24 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></button>
    <button class="rbtn" id="bUndo" aria-label="上一步"><svg viewBox="0 0 48 48"><path d="M18 11 L7 21 L18 31 L18 25 C28 24 35 27 40 36 C39 24 31 16 18 16 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></button>
    <button class="rbtn" id="bDice" aria-label="隨機搭配"><svg viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32" rx="8" fill="#fff"/><g fill="#7d8ef0"><circle cx="17" cy="17" r="3.4"/><circle cx="31" cy="17" r="3.4"/><circle cx="24" cy="24" r="3.4"/><circle cx="17" cy="31" r="3.4"/><circle cx="31" cy="31" r="3.4"/></g></svg></button>
    <button class="rbtn" id="bSound" aria-label="音效"><svg viewBox="0 0 48 48"><path d="M8 19 L16 19 L26 10 L26 38 L16 29 L8 29 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><g id="waves" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M32 18 Q36 24 32 30"/><path d="M37 13 Q44 24 37 35"/></g><path id="muteX" d="M32 18 L42 30 M42 18 L32 30" stroke="#fff" stroke-width="4" stroke-linecap="round" style="display:none"/></svg></button>

    <div id="nextWrap">
      <div id="dots"></div>
      <button class="rbtn" id="bNext" aria-label="下一步"><svg viewBox="0 0 48 48"><path d="M8 19 L25 19 L25 10 L41 24 L25 38 L25 29 L8 29 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></button>
    </div>

    <button class="rbtn" id="bCam" aria-label="拍照儲存">
      <svg viewBox="0 0 64 64">
        <rect x="6" y="16" width="52" height="38" rx="12" fill="#4d7cf0"/>
        <rect x="6" y="16" width="52" height="16" rx="10" fill="#6d95ff"/>
        <rect x="20" y="10" width="18" height="10" rx="4" fill="#4d7cf0"/>
        <rect x="11" y="11" width="9" height="7" rx="3" fill="#ff7aa8"/>
        <circle cx="32" cy="35" r="14" fill="#fff"/><circle cx="32" cy="35" r="10" fill="#3a5fd6"/>
        <circle cx="32" cy="35" r="6" fill="#6f9bff"/><circle cx="28.5" cy="31.5" r="2.6" fill="#fff"/>
      </svg>
    </button>
    <div id="flash"></div>
  </div>

  <div id="panel">
    <div id="tabs"></div>
    <div id="body">
      <div id="palette"></div>
      <div id="grid"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="photo">
  <div class="polaroid">
    <img id="photoImg" alt="娃娃照片">
    <p>我的可愛娃娃</p>
    <div class="pbtns"><a id="dl" download="我的可愛娃娃.png">下載照片</a><button id="closeP">繼續打扮</button></div>
  </div>
</div>

<script>
/* ================= 基本工具 ================= */
const OL = '#3b2317';
const $ = s => document.querySelector(s);
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
const P=(d,f,sw=5,ex='')=>`<path d="${d}" fill="${f}" stroke="${OL}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" ${ex}/>`;
const L=(d,c=OL,sw=4,ex='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const C=(cx,cy,r,f,sw=5)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${sw?OL:'none'}" stroke-width="${sw}"/>`;
const E=(cx,cy,rx,ry,f,sw=5,ex='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${sw?OL:'none'}" stroke-width="${sw}" ${ex}/>`;
const MIR=s=>`<g transform="translate(400,0) scale(-1,1)">${s}</g>`;
const both=s=>s+MIR(s);
function star(cx,cy,R,r,n=5){let d='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}return d+'Z';}
function heart(x,y,s){return `M${x} ${y+.9*s} C${x-1.3*s} ${y+.1*s} ${x-1.1*s} ${y-.95*s} ${x} ${y-.35*s} C${x+1.1*s} ${y-.95*s} ${x+1.3*s} ${y+.1*s} ${x} ${y+.9*s} Z`;}

/* 上色情境：c 主色、f 填色(可能是漸層)、sp 是否閃亮、thumb 縮圖(白底線稿) */
function lum(c){const[r,g,b]=hex2rgb(c);return(.299*r+.587*g+.114*b)/255;}
function mkctx(c,sp,gid){return{c,sp,f:sp?`url(#${gid})`:`url(#${gid}S)`,b:`url(#${gid}B)`,l:`url(#${gid}L)`,dk:mix(c,'#000',.3),lt:mix(c,'#fff',.5),st:lum(c)>.72?mix(c,'#000',.4):'rgba(255,255,255,.85)',thumb:false};}
const THUMB={c:'#fff',sp:false,f:'#fff',b:'#fff',l:'#fff',dk:OL,lt:'#fff',st:'#cdb6dc',thumb:true};
const tc=(col,ctx)=>ctx.thumb?'#fff':col;          // 縮圖時一律白色
function FP(d,fill,ctx,sw=5,kind='small'){return DP(d,fill,ctx,null,sw,kind);} // 帶陰影與亮片

/* ================= 靜態 defs（亮片、壁紙圖騰、光暈） ================= */
function buildStaticDefs(){
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  let g='';
  for(let i=0;i<30;i++)g+=`<circle cx="${(r()*60).toFixed(1)}" cy="${(r()*60).toFixed(1)}" r="${(.5+r()*1.2).toFixed(1)}" fill="#5a1d6e" opacity=".12"/>`;
  const cols=['#ffffff','#fff3b0','#ffd1f0','#e6d4ff','#ffffff'];
  for(let i=0;i<60;i++)g+=`<circle cx="${(r()*60).toFixed(1)}" cy="${(r()*60).toFixed(1)}" r="${(.6+r()*1.7).toFixed(1)}" fill="${cols[i%5]}" opacity="${(.45+r()*.5).toFixed(2)}"/>`;
  for(let i=0;i<5;i++)g+=`<path d="${star(r()*60,r()*60,4.5,1.1,4)}" fill="#fff"/>`;
  const wall=`<g fill="none" stroke="#f5d97a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 46 L18 22 L30 32 Q38 29 46 32 L58 22 L60 46 Q60 62 38 62 Q16 62 16 46 Z"/>
      <path d="M29 45 L34 45 M43 45 L48 45"/><path d="M36 51 Q38 53 40 51"/>
      <path d="${star(108,108,17,8)}"/></g>`;
  const hearts=`<path d="${heart(30,30,10)}" fill="#ffc9e0"/><path d="${heart(95,90,7)}" fill="#e6d2ff"/><path d="${star(95,28,6,2.5,4)}" fill="#fff"/><path d="${star(28,98,5,2,4)}" fill="#fff"/>`;
  $('#staticDefs').innerHTML=`
    <pattern id="glit" width="60" height="60" patternUnits="userSpaceOnUse">${g}</pattern>
    <pattern id="pWall" width="140" height="140" patternUnits="userSpaceOnUse">${wall}</pattern>
    <pattern id="pHeart" width="130" height="130" patternUnits="userSpaceOnUse">${hearts}</pattern>
    <radialGradient id="gSpot"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gBeam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6b0" stop-opacity=".9"/><stop offset="1" stop-color="#fff6b0" stop-opacity="0"/></linearGradient>
    <linearGradient id="gDream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3f1"/><stop offset="1" stop-color="#eadcff"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdeeff"/><stop offset="1" stop-color="#fff5d6"/></linearGradient>`+patDefs()+shadeDefs()+accDefs();
}
const gS=(id,c)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#fff',.32)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,'#000',.14)}"/></linearGradient>`;
function grads(id,c){return grad(id,c)+gS(id+'S',c)
  +`<linearGradient id="${id}B" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#fff',.2)}"/><stop offset="1" stop-color="${mix(c,'#000',.2)}"/></linearGradient>`
  +`<linearGradient id="${id}L" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#fff',.8)}"/><stop offset="1" stop-color="${mix(c,'#fff',.45)}"/></linearGradient>`;}
function grad(id,c){return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#fff',.15)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,'#ffd36e',.55)}"/></linearGradient>`;}
function irisGrad(c){return `<linearGradient id="gIris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c,'#000',.5)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,'#fff',.4)}"/></linearGradient>`;}

/* ================= 身體 / 頭 ================= */
const SKINS=[{n:'粉嫩',c:'#ffd6d0'},{n:'白皙',c:'#fff1e8'},{n:'蜜桃',c:'#ffd8b4'},{n:'小麥',c:'#e6ae82'},{n:'可可',c:'#8e5a3c'}];
const ARM='M168 328 C150 336 136 356 128 382 C124 396 122 408 132 412 C142 415 148 404 150 394 C154 378 160 364 172 352 Z';
const LEG='M170 405 L170 500 Q170 510 181 510 Q192 510 192 500 L192 405 Z';
function bodySVG(sk){
  return P('M186 296 L186 330 L214 330 L214 296 Z',sk)+P('M160 322 Q200 312 240 322 L246 420 L154 420 Z',sk)+both(P(LEG,sk))+both(P(ARM,sk));
}
const faceShape=sk=>C(92,234,20,sk)+C(308,234,20,sk)+E(200,215,108,98,sk);
function headSVG(sk){
  return E(200,319,36,9,'#7a3f55',0,'opacity=".22"')+faceShape(sk)+E(136,276,20,12,'#ff8f9c',0,'opacity=".5"')+E(264,276,20,12,'#ff8f9c',0,'opacity=".5"')+L('M195 266 Q200 271 205 266',OL,4);
}

/* ================= 髮型 ================= */
const HB_LONG='M100 180 C95 110 145 88 200 88 C255 88 305 110 300 180 C318 260 322 340 318 420 Q300 432 280 426 Q260 436 240 428 L160 428 Q140 436 120 426 Q100 432 82 420 C78 340 82 260 100 180 Z';
const HB_BOB='M92 200 C85 110 140 90 200 90 C260 90 315 110 308 200 L318 300 Q300 314 280 306 Q240 318 200 314 Q160 318 120 306 Q100 314 82 300 Z';
const HB_SHORT='M92 215 C85 110 140 90 200 90 C260 90 315 110 308 215 Q200 240 92 215 Z';
const HF_PART='M86 250 C76 150 120 92 200 92 C280 92 324 150 314 250 C306 215 292 190 270 172 C245 152 215 140 201 112 C187 140 158 155 132 172 C110 188 94 215 86 250 Z';
const HF_BANGS='M88 245 C78 140 130 92 200 92 C270 92 322 140 312 245 C306 215 302 190 298 170 Q275 186 250 172 Q225 188 200 174 Q175 188 150 172 Q125 186 102 170 C98 190 94 215 88 245 Z';
const HF_SWEEP='M88 245 C78 140 130 92 200 92 C270 92 322 140 312 245 C304 205 290 178 262 160 C225 140 170 146 132 170 C110 186 95 212 88 245 Z';
const HF_SPIKY='M86 232 C78 130 130 90 200 88 C270 90 322 130 314 232 L302 182 L286 194 L272 166 L252 184 L236 160 L216 180 L200 156 L184 180 L164 160 L148 184 L128 166 L114 194 L98 182 Z';
const TAIL='M104 190 C58 184 36 250 46 330 C50 372 70 398 80 384 C74 352 82 330 94 300 C106 270 114 232 104 190 Z';
const partLines=h=>L('M201 96 L201 114',h.dk,3)+L('M150 125 Q128 150 116 188',h.dk,3)+L('M250 125 Q272 150 284 188',h.dk,3);
const bangLines=h=>L('M150 118 L148 150',h.dk,3)+L('M250 118 L252 150',h.dk,3)+L('M200 110 L200 140',h.dk,3);
const longLines=h=>both(L('M104 300 Q98 360 104 410',h.dk,3));
function curlyBack(h){
  const pts=[];for(let i=0;i<24;i++){const a=i/24*Math.PI*2;pts.push([200+130*Math.cos(a),245+150*Math.sin(a)]);}
  return pts.map(p=>C(p[0].toFixed(1),p[1].toFixed(1),30,h.c,10)).join('')+pts.map(p=>C(p[0].toFixed(1),p[1].toFixed(1),30,h.c,0)).join('')
    +E(200,245,130,150,h.c,0)+[[80,260],[320,260],[90,340],[310,340],[120,390],[280,390]].map(p=>L(`M${p[0]-10} ${p[1]} q10 -14 20 0`,h.dk,3)).join('');
}
const bun=(x,y,r,h)=>C(x,y,r,h.c)+L(`M${x-14} ${y-2} Q${x} ${y-18} ${x+14} ${y} Q${x+2} ${y+14} ${x-8} ${y+4}`,h.dk,3);
const tie=(x,y,ctx)=>C(x,y,11,tc('#ff8fc0',ctx))+C(400-x,y,11,tc('#ff8fc0',ctx));
const HAIRS=[

function bez(p0,p1,p2,p3,n){const a=[];for(let i=0;i<n;i++){const t=i/(n-1),u=1-t;a.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return a;}
function braid(pts,s0,s1,h){                         // 立體麻花辮：交錯的髮束
  let s='';
  pts.forEach((p,i)=>{const q=pts[Math.min(i+1,pts.length-1)],r=pts[Math.max(i-1,0)];
    const ang=Math.atan2(q[1]-r[1],q[0]-r[0]),sz=s0+(s1-s0)*i/(pts.length-1),side=i%2?1:-1;
    const cx=(p[0]-Math.sin(ang)*side*sz*.3).toFixed(1),cy=(p[1]+Math.cos(ang)*side*sz*.3).toFixed(1);
    s+=`<g transform="translate(${cx},${cy}) rotate(${(ang*180/Math.PI+side*38).toFixed(1)})"><ellipse rx="${sz.toFixed(1)}" ry="${(sz*.6).toFixed(1)}" fill="${h.c}" stroke="${OL}" stroke-width="3.2"/>`
      +(h.thumb?'':`<ellipse rx="${sz.toFixed(1)}" ry="${(sz*.6).toFixed(1)}" fill="url(#shRound)" opacity=".6"/><ellipse cx="${(-sz*.2).toFixed(1)}" cy="${(-sz*.2).toFixed(1)}" rx="${(sz*.35).toFixed(1)}" ry="${(sz*.12).toFixed(1)}" fill="#fff" opacity=".35"/>`)
      +`<path d="M${(-sz*.6).toFixed(1)} ${(sz*.08).toFixed(1)} Q0 ${(-sz*.22).toFixed(1)} ${(sz*.6).toFixed(1)} ${(sz*.08).toFixed(1)}" fill="none" stroke="${h.dk}" stroke-width="1.6" opacity=".7"/></g>`;});
  return s;
}

  {n:'公主臥室',bg:'#ffdfec',d:sBedroom},{n:'時尚攝影棚',bg:'#fff3cc',d:sStudio},{n:'魔法森林',bg:'#e3f7e6',d:sForest},
  {n:'下午茶花園',bg:'#e6f5ef',d:sTea},{n:'星空舞台',bg:'#2d2a74',d:sStage},{n:'糖果樂園',bg:'#fde2ef',d:sCandy},
  {n:'櫻花庭園',bg:'#ffeef4',d:sSakura},{n:'城堡大廳',bg:'#f9e6c4',d:sCastle},{n:'蔚藍海灘',bg:'#bfe8ff',d:sBeach},{n:'文青咖啡廳',bg:'#f6e6d2',d:sCafe});
{const i=SCENES.findIndex(x=>x.n==='攝影棚');if(i>=0)SCENES.splice(i,1);}


/* ================= 分頁定義 ================= */
const ICONS={
  skin:`<ellipse cx="24" cy="25" rx="17" ry="16" fill="#ffd6d0" stroke="${OL}" stroke-width="3"/><circle cx="18" cy="25" r="2.6" fill="${OL}"/><circle cx="30" cy="25" r="2.6" fill="${OL}"/><path d="M20 32 Q24 35 28 32" fill="none" stroke="${OL}" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="14" cy="30" rx="3.5" ry="2" fill="#ff8f9c" opacity=".6"/><ellipse cx="34" cy="30" rx="3.5" ry="2" fill="#ff8f9c" opacity=".6"/>`,
  hair:`<path d="M8 40 C4 14 16 6 24 6 C32 6 44 14 40 40 L34 40 C34 24 30 18 24 14 C20 20 16 22 14 40 Z" fill="#a3640e" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/>`,
  eyes:`<ellipse cx="24" cy="26" rx="13" ry="15" fill="#fff" stroke="${OL}" stroke-width="3"/><ellipse cx="24" cy="28" rx="9" ry="11" fill="#9a4a1a"/><ellipse cx="24" cy="29" rx="4.5" ry="5.5" fill="#1b100b"/><circle cx="20" cy="24" r="3" fill="#fff"/><path d="M9 20 Q24 4 39 20" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`,
  mouth:`<path d="M10 20 Q24 24 38 20 Q36 38 24 38 Q12 38 10 20 Z" fill="#d6405c" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/><path d="M16 32 Q24 26 32 32 Q28 38 24 38 Q20 38 16 32 Z" fill="#ff8fa3"/>`,
  outfit:`<path d="M17 6 L31 6 L32 18 L42 42 L6 42 L16 18 Z" fill="#c779ef" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/><path d="M16 18 L32 18" stroke="${OL}" stroke-width="3"/><circle cx="18" cy="30" r="1.6" fill="#fff"/><circle cx="29" cy="34" r="1.6" fill="#fff"/><circle cx="24" cy="26" r="1.3" fill="#fff"/>`,
  shoes:`<path d="M8 10 L18 10 L18 36 Q18 42 12 42 L4 42 Q2 36 8 32 Z M26 10 L36 10 L36 36 Q36 42 30 42 L22 42 Q20 36 26 32 Z" fill="#ffd84d" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/>`,
  acc:`<path d="M6 36 L8 12 L17 22 L24 8 L31 22 L40 12 L42 36 Z" fill="#ff86c2" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="29" r="3" fill="#fff"/>`,
  bg:`<rect x="5" y="9" width="38" height="30" rx="6" fill="#bfe9ff" stroke="${OL}" stroke-width="3"/><path d="M5 33 L17 22 L26 30 L32 25 L43 34 L43 33 Q43 39 37 39 L11 39 Q5 39 5 33 Z" fill="#8fd46d"/><circle cx="34" cy="17" r="4" fill="#ffe07a"/>`,
};
const TABS=[
  {key:'skin',n:'膚色',items:SKINS,vb:'65 100 270 230'},
  {key:'hair',n:'髮型',items:HAIRS,colors:HAIR_COLORS,vb:'40 34 320 410'},
  {key:'eyes',n:'眼睛',items:EYES,colors:EYE_COLORS,vb:'100 160 200 110'},
  {key:'mouth',n:'嘴巴',items:MOUTHS,vb:'168 262 64 56'},
  {key:'outfit',n:'服裝',items:OUTFITS,colors:OUTFIT_COLORS,sparkle:true,vb:'96 305 208 228'},
  {key:'shoes',n:'鞋子',items:SHOES,colors:SHOE_COLORS,sparkle:true,vb:'138 436 124 100'},
  {key:'acc',n:'配件',items:ACCS,colors:ACC_COLORS,sparkle:true,vb:'55 0 290 330'},
  {key:'bg',n:'場景',items:SCENES,vb:'0 0 700 720'},
];
const FX_POS={skin:[200,215],hair:[200,120],eyes:[200,232],mouth:[200,292],outfit:[200,400],shoes:[200,505],acc:[200,110]};

/* ================= 狀態 ================= */
const DEFAULT={skin:0,hair:{s:0,c:HAIR_COLORS[0]},eyes:{s:0,c:EYE_COLORS[0]},mouth:{s:0},
  outfit:{s:0,c:OUTFIT_COLORS[0],sp:true},shoes:{s:0,c:SHOE_COLORS[0],sp:true},acc:{s:0,c:ACC_COLORS[0],sp:false},bg:0};
let st=JSON.parse(JSON.stringify(DEFAULT));
let tab=0, visited=new Set([0]);
const history=[];
const push=()=>{history.push(JSON.stringify(st));if(history.length>60)history.shift();};

/* ================= 繪製 ================= */
function buildChar(s){
  const sk=SKINS[s.skin].c;
  const h={c:'url(#gHair)',dk:mix(s.hair.c,'#000',.35)};
  const H=HAIRS[s.hair.s],A=ACCS[s.acc.s];
  const a=mkctx(s.acc.c,s.acc.sp,'gAcc'),o=mkctx(s.outfit.c,s.outfit.sp,'gOut'),sh=mkctx(s.shoes.c,s.shoes.sp,'gShoe');
  const ir='url(#gIris)';
  return H.back(h)+(A.back?A.back(a):'')+bodySVG(sk)+both(SHOES[s.shoes.s].d(sh,sk))+OUTFITS[s.outfit.s].d(o,sk)
    +headSVG(sk)+EYES[s.eyes.s].d(ir)+`<g transform="translate(0,-4)">${MOUTHS[s.mouth.s].d()}</g>`
    +H.front(h)+shine+(A.front?A.front(a):'');
}
function render(){
  $('#dynDefs').innerHTML=grads('gOut',st.outfit.c)+grads('gShoe',st.shoes.c)+grads('gAcc',st.acc.c)+irisGrad(st.eyes.c)+`<linearGradient id="gHalo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(st.acc.c,'#fff',.6)}"/><stop offset=".5" stop-color="${st.acc.c}"/><stop offset="1" stop-color="${mix(st.acc.c,'#000',.25)}"/></linearGradient>`+`<radialGradient id="gAccR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${mix(st.acc.c,'#fff',.6)}"/><stop offset=".5" stop-color="${st.acc.c}"/><stop offset="1" stop-color="${mix(st.acc.c,'#000',.3)}"/></radialGradient>`+`<linearGradient id="gHair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(st.hair.c,'#fff',.22)}"/><stop offset=".45" stop-color="${st.hair.c}"/><stop offset="1" stop-color="${mix(st.hair.c,'#000',.2)}"/></linearGradient>`+gS('gRbA',mix(st.outfit.c,'#ffd36e',.55))+gS('gRbB',mix(st.outfit.c,'#8fe0ff',.55));
  $('#charLayers').innerHTML=buildChar(st);
  $('#scene').innerHTML=SCENES[st.bg].d();
  $('#stageWrap').style.background=SCENES[st.bg].bg;
}
function thumb(key,i){
  const T=TABS.find(t=>t.key===key);
  const face=faceShape('#fff');
  const hw={c:'#fff',dk:OL,thumb:true};
  let inner='';
  switch(key){
    case 'skin':{const c=SKINS[i].c;inner=faceShape(c)+E(136,262,18,10,'#ff8f9c',0,'opacity=".5"')+E(264,262,18,10,'#ff8f9c',0,'opacity=".5"')+E(150,232,10,13,OL,0)+E(250,232,10,13,OL,0)+C(147,227,3.5,'#fff',0)+C(247,227,3.5,'#fff',0)+L('M185 280 Q200 292 215 280',OL,5);break;}
    case 'hair':inner=HAIRS[i].back(hw)+face+HAIRS[i].front(hw);break;
    case 'eyes':inner=EYES[i].d('url(#gIris)');break;
    case 'mouth':inner=MOUTHS[i].d();break;
    case 'outfit':inner=OUTFITS[i].d(THUMB,'#fff');break;
    case 'shoes':inner=both(SHOES[i].d(THUMB,'#fff'));break;
    case 'acc':{const A=ACCS[i];inner=(A.back?A.back(THUMB):'')+face+(A.front?A.front(THUMB):'')+(i===0?L('M170 185 L230 245 M230 185 L170 245','#e7c6f4',10):'');break;}
    case 'bg':inner=SCENES[i].d();break;
  }
  return `<svg viewBox="${T.vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}
function selIndex(key){return key==='skin'?st.skin:key==='bg'?st.bg:st[key].s;}

function renderTabs(){
  $('#tabs').innerHTML=TABS.map((t,i)=>`<button class="tab ${i===tab?'on':''}" data-t="${i}" aria-label="${t.n}"><svg viewBox="0 0 48 48">${ICONS[t.key]}</svg><small>${t.n}</small></button>`).join('');
  $('#dots').innerHTML=TABS.map((_,i)=>`<i class="${visited.has(i)?'on':''}"></i>`).join('');
}
function renderPanel(){
  const T=TABS[tab];
  const pal=$('#palette');
  if(T.colors){
    pal.classList.remove('hide');
    let h='';
    if(T.sparkle)h+=`<button class="sw spark ${st[T.key].sp?'on':''}" data-spark="1" aria-label="亮片效果"><svg viewBox="0 0 24 24"><path d="${star(12,12,10,3.2,4)}" fill="#fff"/></svg></button><div class="divider"></div>`;
    h+=T.colors.map(c=>`<button class="sw ${st[T.key].c===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="顏色"></button>`).join('');
    pal.innerHTML=h;
  }else pal.classList.add('hide');
  const cur=selIndex(T.key);
  $('#grid').innerHTML=T.items.map((it,i)=>`<button class="card ${i===cur?'on':''}" data-i="${i}">${thumb(T.key,i)}<span>${it.n}</span></button>`).join('');
}
function refreshSelection(){
  const T=TABS[tab],cur=selIndex(T.key);
  document.querySelectorAll('#grid .card').forEach((c,i)=>c.classList.toggle('on',i===cur));
  document.querySelectorAll('#palette .sw[data-c]').forEach(b=>b.classList.toggle('on',st[T.key].c===b.dataset.c));
  const sp=$('#palette .spark');if(sp)sp.classList.toggle('on',!!st[T.key].sp);
}

/* ================= 特效 / 音效 ================= */
let AC=null,muted=false;
function tone(f1,f2,dur=.13,type='sine',vol=.07){
  if(muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);}catch(e){}
}
const pop=()=>tone(520+Math.random()*200,1100,.12);
function boing(){const b=$('#boing');b.classList.remove('go');void b.getBoundingClientRect();b.classList.add('go');}
function burst(key,n=9,spread=90){
  const [x,y]=FX_POS[key]||[200,300];const cols=['#ffd84d','#ff8fc0','#9ee0ff','#c79bff','#fff'];
  let s='';
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=spread*(.5+Math.random()*.6);
    const shape=i%3===0?heart(0,0,7):star(0,0,10,4);
    s+=`<g transform="translate(${x},${y})"><path d="${shape}" fill="${cols[i%5]}" stroke="${OL}" stroke-width="2" class="spk" style="--dx:${(Math.cos(a)*r).toFixed(0)}px;--dy:${(Math.sin(a)*r).toFixed(0)}px"/></g>`;}
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=s;$('#fx').appendChild(g);setTimeout(()=>g.remove(),850);
}
function changed(key){render();refreshSelection();pop();if(key!=='bg'){boing();burst(key);}}

/* ================= 互動 ================= */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;tab=+b.dataset.t;visited.add(tab);renderTabs();renderPanel();tone(700,900,.08,'triangle',.05);});
$('#grid').addEventListener('click',e=>{
  const b=e.target.closest('.card');if(!b)return;const T=TABS[tab],i=+b.dataset.i;
  if(selIndex(T.key)===i){boing();pop();return;}
  push();
  if(T.key==='skin')st.skin=i;else if(T.key==='bg')st.bg=i;else st[T.key].s=i;
  if((T.key==='acc'||T.key==='shoes')&&T.items[i].def){st[T.key].c=T.items[i].def;if(T.items[i].sp!==undefined)st[T.key].sp=T.items[i].sp;}
  if(T.key==='skin'||T.key==='eyes'){render();renderPanel();pop();boing();burst(T.key);}else changed(T.key);
});
$('#palette').addEventListener('click',e=>{
  const b=e.target.closest('.sw');if(!b)return;const T=TABS[tab];push();
  if(b.dataset.spark)st[T.key].sp=!st[T.key].sp;else st[T.key].c=b.dataset.c;
  if(T.key==='hair'){render();renderPanel();pop();boing();burst('hair');}else changed(T.key);
});
$('#bNext').onclick=()=>{
  tone(600,1000,.1,'triangle');
  if(tab===TABS.length-1){celebrate();tab=0;}else tab++;
  visited.add(tab);renderTabs();renderPanel();
};
$('#bUndo').onclick=()=>{if(!history.length){boing();return;}st=JSON.parse(history.pop());render();renderPanel();tone(800,500,.12);boing();};
$('#bHome').onclick=()=>{push();st=JSON.parse(JSON.stringify(DEFAULT));tab=0;visited=new Set([0]);render();renderTabs();renderPanel();tone(500,300,.15);boing();};
$('#bDice').onclick=()=>{
  push();const R=a=>a[Math.floor(Math.random()*a.length)],ri=n=>Math.floor(Math.random()*n);
  st={skin:ri(SKINS.length),hair:{s:ri(HAIRS.length),c:R(HAIR_COLORS)},eyes:{s:ri(EYES.length),c:R(EYE_COLORS)},mouth:{s:ri(MOUTHS.length)},
    outfit:{s:ri(OUTFITS.length),c:R(OUTFIT_COLORS),sp:Math.random()<.6},shoes:{s:ri(SHOES.length),c:R(SHOE_COLORS),sp:Math.random()<.4},
    acc:{s:ri(ACCS.length),c:R(ACC_COLORS),sp:Math.random()<.5},bg:ri(SCENES.length)};
  render();renderPanel();boing();celebrate(true);[0,90,180].forEach((d,k)=>setTimeout(()=>tone(500+k*200,900+k*200,.1),d));
};
$('#bSound').onclick=()=>{muted=!muted;$('#waves').style.display=muted?'none':'';$('#muteX').style.display=muted?'':'none';};
function celebrate(small){
  ['hair','eyes','outfit','shoes'].forEach((k,i)=>setTimeout(()=>burst(k,small?6:12,small?80:140),i*120));
  if(!small){[0,120,240,360].forEach((d,i)=>setTimeout(()=>tone(520*Math.pow(1.26,i),700*Math.pow(1.26,i),.14,'triangle'),d));
    const c=$('#bCam');c.classList.remove('hint');void c.offsetWidth;c.classList.add('hint');}
}

/* 拍照：把整個舞台 SVG 轉成 PNG */
$('#bCam').onclick=()=>{
  const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  tone(1800,300,.08,'square',.05);setTimeout(()=>tone(1200,200,.1,'square',.04),90);
  const svg=$('#stage').cloneNode(true);
  svg.querySelector('#fx').innerHTML='';
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('width','1400');svg.setAttribute('height','1440');
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=1400;cv.height=1440;const g=cv.getContext('2d');
    g.drawImage(img,0,0,1400,1440);
    let data;try{data=cv.toDataURL('image/png');}catch(e){data=url;}
    $('#photoImg').src=data;$('#dl').href=data;$('#photo').classList.add('show');
    photoFile=null;try{cv.toBlob(bl=>{if(bl){const fn='cute-doll-'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.png';photoFile=new File([bl],fn,{type:'image/png'});try{$('#dl').href=URL.createObjectURL(bl);$('#dl').setAttribute('download',fn);}catch(e){}}},'image/png');}catch(e){}
  };
  img.src=url;
};
$('#closeP').onclick=()=>$('#photo').classList.remove('show');
/* 下載照片：iPad / iPhone 用分享面板「儲存影像」存進照片 App；電腦直接下載。按下後關閉彈窗 */
let photoFile=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}
$('#dl').addEventListener('click',e=>{
  const close=()=>$('#photo').classList.remove('show');
  if(photoFile&&navigator.canShare&&navigator.canShare({files:[photoFile]})){
    e.preventDefault();
    navigator.share({files:[photoFile],title:'我的可愛娃娃'})
      .then(()=>{close();toast('照片已儲存！');tone(900,1400,.15,'triangle');})
      .catch(()=>close());
    return;
  }
  setTimeout(()=>{close();toast('照片已下載！');},150);
});
$('#photo').addEventListener('click',e=>{if(e.target.id==='photo')$('#photo').classList.remove('show');});

/* ================= 啟動 ================= */
buildStaticDefs();render();renderTabs();renderPanel();
</script>
</body>
</html>
